name: Schedora checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check (backend and frontend)
        run: npm run check
      - name: Shared forms logic is in sync
        run: npm run sync-shared -- --check
      - name: Vendored LiveKit browser SDK matches the pinned version
        run: npm run vendor-livekit -- --check
      - name: Unit, API and integration tests
        run: npm test
      - name: Browser journeys and responsive layout
        run: npm run browser-check
        env:
          CHROME_PATH: /usr/bin/google-chrome

name: Schedora checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Which AWS stack to deploy after CI completes
        required: true
        type: choice
        options:
          - meet
          - livekit-staging
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check (backend and frontend)
        run: npm run check
      - name: Shared forms logic is in sync
        run: npm run sync-shared -- --check
      - name: Vendored LiveKit browser SDK matches the pinned version
        run: npm run vendor-livekit -- --check
      - name: Unit, API and integration tests
        run: npm test
      - name: Browser journeys and responsive layout
        run: npm run browser-check
        env:
          CHROME_PATH: /usr/bin/google-chrome
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start disposable PostgreSQL with verified TLS
        run: |
          mkdir -p "$RUNNER_TEMP/schedora-pg-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$RUNNER_TEMP/schedora-pg-tls/server.key" -out "$RUNNER_TEMP/schedora-pg-tls/server.crt" -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' > /dev/null 2>&1
          pg_uid=$(docker run --rm --entrypoint id postgres:17 -u postgres)
          chmod 600 "$RUNNER_TEMP/schedora-pg-tls/server.key"
          sudo chown "$pg_uid" "$RUNNER_TEMP/schedora-pg-tls/server.key"
          docker run --detach --name schedora-test-pg -p 127.0.0.1:54329:5432 -e POSTGRES_PASSWORD=schedora-ci-disposable -v "$RUNNER_TEMP/schedora-pg-tls:/tls:ro" postgres:17 -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          for attempt in {1..30}; do
            if docker exec schedora-test-pg pg_isready -h 127.0.0.1 -U postgres; then exit 0; fi
            sleep 1
          done
          docker logs schedora-test-pg
          exit 1
      - name: PostgreSQL upgrades, Flow evidence, Forms (including media migration 014, quotas and access), monitoring and concurrency
        env:
          DATABASE_URL: postgres://postgres:schedora-ci-disposable@127.0.0.1:54329/postgres
        run: |
          export DATABASE_CA_CERT="$(cat "$RUNNER_TEMP/schedora-pg-tls/server.crt")"
          npm run test:postgres -- test/flow.test.mjs test/meet-readiness.test.mjs test/host-readiness.test.mjs test/enquiry-trail.test.mjs test/forms-reliability.test.mjs test/forms-media.test.mjs test/forms-jumps.test.mjs test/forms-choice-rules.test.mjs test/forms-url-params.test.mjs test/forms-evaluation-policy.test.mjs test/forms-rollout-compat.test.mjs test/forms-freeze.test.mjs test/forms-definition-io.test.mjs test/forms-respondent-signin.test.mjs test/forms-respondent-switch.test.mjs test/forms-response-filter.test.mjs test/forms-themes.test.mjs test/forms-groups.test.mjs test/meet-session.test.mjs test/monitoring.test.mjs test/email-reports.test.mjs test/task-deadlines.test.mjs test/postgres.test.mjs
      - name: Release rehearsal against the revision production runs
        env:
          DATABASE_URL: postgres://postgres:schedora-ci-disposable@127.0.0.1:54329/postgres
          CHROME_PATH: /usr/bin/google-chrome
          # Update when production moves. See docs/RELEASE_ACCEPTANCE.md.
          REHEARSAL_BASELINE: e3b6b5d73829
          # The rollback build: e3b6b5d plus the authoring freeze.
          REHEARSAL_ROLLBACK_BUILD: a412507c2d5d
        run: |
          export DATABASE_CA_CERT="$(cat "$RUNNER_TEMP/schedora-pg-tls/server.crt")"
          git fetch --no-tags --quiet origin main
          mkdir -p "$RUNNER_TEMP/baseline"
          git -C .. archive "$REHEARSAL_BASELINE" | tar -x -C "$RUNNER_TEMP/baseline"
          git fetch --no-tags --quiet origin codex/forms-rollback-e3b6b5d
          mkdir -p "$RUNNER_TEMP/rollback"
          git -C .. archive "$REHEARSAL_ROLLBACK_BUILD" | tar -x -C "$RUNNER_TEMP/rollback"
          npm run release-rehearsal -- --prev "$RUNNER_TEMP/baseline" --rollback-build "$RUNNER_TEMP/rollback"
      - name: Remove disposable database
        if: always()
        run: docker rm --force schedora-test-pg || true

  deploy-aws:
    name: Deploy Meet to AWS
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'meet')
    needs: [verify, postgres]
    runs-on: ubuntu-latest
    concurrency:
      group: schedora-meet-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: '255948905492'
      ECR_REPOSITORY: schedora-web
      CLOUDFORMATION_STACK: schedora-web
      AWS_DEPLOY_ROLE_ARN: ${{ vars.SCHEDORA_AWS_DEPLOY_ROLE_ARN }}
      APP_SECRET_ARN: ${{ vars.SCHEDORA_APP_SECRET_ARN }}
      CERTIFICATE_ARN: ${{ vars.SCHEDORA_MEET_CERTIFICATE_ARN }}
      VPC_ID: ${{ vars.SCHEDORA_VPC_ID }}
      PUBLIC_SUBNET_A: ${{ vars.SCHEDORA_PUBLIC_SUBNET_A }}
      PUBLIC_SUBNET_B: ${{ vars.SCHEDORA_PUBLIC_SUBNET_B }}
      BASE_URL: https://meet.schedora.in
      PRODUCT_DOMAIN: schedora.in
    steps:
      - name: Check required deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_DEPLOY_ROLE_ARN APP_SECRET_ARN CERTIFICATE_ARN VPC_ID PUBLIC_SUBNET_A PUBLIC_SUBNET_B; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions variable: $name" >&2
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - name: Configure AWS access with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS deployment identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable app image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build --pull --tag "$image_uri" .
          docker push "$image_uri"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Create or update the Meet stack
        shell: bash
        run: |
          set -euo pipefail
          parameters=(
            "ParameterKey=VpcId,ParameterValue=$VPC_ID"
            "ParameterKey=PublicSubnetA,ParameterValue=$PUBLIC_SUBNET_A"
            "ParameterKey=PublicSubnetB,ParameterValue=$PUBLIC_SUBNET_B"
            "ParameterKey=CertificateArn,ParameterValue=$CERTIFICATE_ARN"
            "ParameterKey=ImageUri,ParameterValue=$IMAGE_URI"
            "ParameterKey=AppSecretArn,ParameterValue=$APP_SECRET_ARN"
            "ParameterKey=BaseUrl,ParameterValue=$BASE_URL"
            "ParameterKey=ProductDomain,ParameterValue=$PRODUCT_DOMAIN"
          )
          if aws cloudformation describe-stacks --stack-name "$CLOUDFORMATION_STACK" >/dev/null 2>&1; then
            if update_output=$(aws cloudformation update-stack \
              --stack-name "$CLOUDFORMATION_STACK" \
              --template-body file://infra/aws/schedora-web.yaml \
              --parameters "${parameters[@]}" \
              --capabilities CAPABILITY_NAMED_IAM 2>&1); then
              echo "$update_output"
              aws cloudformation wait stack-update-complete --stack-name "$CLOUDFORMATION_STACK"
            else
              if grep -q 'No updates are to be performed' <<< "$update_output"; then
                echo "$update_output"
                echo 'CloudFormation stack already matches this revision.'
              else
                echo "$update_output" >&2
                exit 1
              fi
            fi
          else
            aws cloudformation create-stack \
              --stack-name "$CLOUDFORMATION_STACK" \
              --template-body file://infra/aws/schedora-web.yaml \
              --parameters "${parameters[@]}" \
              --capabilities CAPABILITY_NAMED_IAM
            aws cloudformation wait stack-create-complete --stack-name "$CLOUDFORMATION_STACK"
          fi

      - name: Publish load balancer address
        shell: bash
        run: |
          set -euo pipefail
          dns_name=$(aws cloudformation describe-stacks \
            --stack-name "$CLOUDFORMATION_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='LoadBalancerDnsName'].OutputValue | [0]" \
            --output text)
          echo "Meet load balancer: $dns_name" >> "$GITHUB_STEP_SUMMARY"

  deploy-livekit-staging:
    name: Deploy LiveKit staging to AWS
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'livekit-staging'
    needs: [verify, postgres]
    runs-on: ubuntu-latest
    concurrency:
      group: schedora-livekit-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      CLOUDFORMATION_STACK: schedora-livekit-staging
      AWS_DEPLOY_ROLE_ARN: ${{ vars.SCHEDORA_AWS_DEPLOY_ROLE_ARN }}
      VPC_ID: ${{ vars.SCHEDORA_VPC_ID }}
      PUBLIC_SUBNET_ID: ${{ vars.SCHEDORA_PUBLIC_SUBNET_A }}
      LIVEKIT_CLOUD_INIT_BASE64: ${{ secrets.SCHEDORA_LIVEKIT_CLOUD_INIT_BASE64 }}
    steps:
      - name: Check required deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_DEPLOY_ROLE_ARN VPC_ID PUBLIC_SUBNET_ID LIVEKIT_CLOUD_INIT_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions setting: $name" >&2
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - name: Configure AWS access with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create or update the LiveKit staging stack
        shell: bash
        run: |
          set -euo pipefail
          parameters=(
            "ParameterKey=VpcId,ParameterValue=$VPC_ID"
            "ParameterKey=PublicSubnetId,ParameterValue=$PUBLIC_SUBNET_ID"
            "ParameterKey=LiveKitCloudInitBase64,ParameterValue=$LIVEKIT_CLOUD_INIT_BASE64"
          )
          if aws cloudformation describe-stacks --stack-name "$CLOUDFORMATION_STACK" >/dev/null 2>&1; then
            if update_output=$(aws cloudformation update-stack \
              --stack-name "$CLOUDFORMATION_STACK" \
              --template-body file://infra/aws/livekit-staging.yaml \
              --parameters "${parameters[@]}" \
              --capabilities CAPABILITY_NAMED_IAM 2>&1); then
              echo "$update_output"
              aws cloudformation wait stack-update-complete --stack-name "$CLOUDFORMATION_STACK"
            else
              if grep -q 'No updates are to be performed' <<< "$update_output"; then
                echo "$update_output"
                echo 'LiveKit staging stack already matches this revision.'
              else
                echo "$update_output" >&2
                exit 1
              fi
            fi
          else
            aws cloudformation create-stack \
              --stack-name "$CLOUDFORMATION_STACK" \
              --template-body file://infra/aws/livekit-staging.yaml \
              --parameters "${parameters[@]}" \
              --capabilities CAPABILITY_NAMED_IAM
            aws cloudformation wait stack-create-complete --stack-name "$CLOUDFORMATION_STACK"
          fi

      - name: Publish LiveKit staging endpoint
        shell: bash
        run: |
          set -euo pipefail
          public_ip=$(aws cloudformation describe-stacks \
            --stack-name "$CLOUDFORMATION_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='LiveKitElasticIpAddress'].OutputValue | [0]" \
            --output text)
          echo "LiveKit staging Elastic IP: $public_ip" >> "$GITHUB_STEP_SUMMARY"

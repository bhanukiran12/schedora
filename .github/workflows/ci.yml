name: Schedora checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check (backend and frontend)
        run: npm run check
      - name: Shared forms logic is in sync
        run: npm run sync-shared -- --check
      - name: Vendored LiveKit browser SDK matches the pinned version
        run: npm run vendor-livekit -- --check
      - name: Unit, API and integration tests
        run: npm test
      - name: Browser journeys and responsive layout
        run: npm run browser-check
        env:
          CHROME_PATH: /usr/bin/google-chrome
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start disposable PostgreSQL with verified TLS
        run: |
          mkdir -p "$RUNNER_TEMP/schedora-pg-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$RUNNER_TEMP/schedora-pg-tls/server.key" -out "$RUNNER_TEMP/schedora-pg-tls/server.crt" -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' > /dev/null 2>&1
          pg_uid=$(docker run --rm --entrypoint id postgres:17 -u postgres)
          chmod 600 "$RUNNER_TEMP/schedora-pg-tls/server.key"
          sudo chown "$pg_uid" "$RUNNER_TEMP/schedora-pg-tls/server.key"
          docker run --detach --name schedora-test-pg -p 127.0.0.1:54329:5432 -e POSTGRES_PASSWORD=schedora-ci-disposable -v "$RUNNER_TEMP/schedora-pg-tls:/tls:ro" postgres:17 -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          for attempt in {1..30}; do
            if docker exec schedora-test-pg pg_isready -h 127.0.0.1 -U postgres; then exit 0; fi
            sleep 1
          done
          docker logs schedora-test-pg
          exit 1
      - name: PostgreSQL upgrades, Flow evidence, Forms (including media migration 014, quotas and access), monitoring and concurrency
        env:
          DATABASE_URL: postgres://postgres:schedora-ci-disposable@127.0.0.1:54329/postgres
        run: |
          export DATABASE_CA_CERT="$(cat "$RUNNER_TEMP/schedora-pg-tls/server.crt")"
          npm run test:postgres -- test/flow.test.mjs test/meet-readiness.test.mjs test/host-readiness.test.mjs test/enquiry-trail.test.mjs test/forms-reliability.test.mjs test/forms-media.test.mjs test/forms-jumps.test.mjs test/forms-choice-rules.test.mjs test/forms-url-params.test.mjs test/forms-evaluation-policy.test.mjs test/forms-rollout-compat.test.mjs test/forms-freeze.test.mjs test/forms-definition-io.test.mjs test/forms-themes.test.mjs test/forms-groups.test.mjs test/meet-session.test.mjs test/monitoring.test.mjs test/email-reports.test.mjs test/task-deadlines.test.mjs test/postgres.test.mjs
      - name: Release rehearsal against the revision production runs
        env:
          DATABASE_URL: postgres://postgres:schedora-ci-disposable@127.0.0.1:54329/postgres
          CHROME_PATH: /usr/bin/google-chrome
          # Update when production moves. See docs/RELEASE_ACCEPTANCE.md.
          REHEARSAL_BASELINE: e3b6b5d73829
          # The rollback build: e3b6b5d plus the authoring freeze.
          REHEARSAL_ROLLBACK_BUILD: a412507c2d5d
        run: |
          export DATABASE_CA_CERT="$(cat "$RUNNER_TEMP/schedora-pg-tls/server.crt")"
          git fetch --no-tags --quiet origin main
          mkdir -p "$RUNNER_TEMP/baseline"
          git -C .. archive "$REHEARSAL_BASELINE" | tar -x -C "$RUNNER_TEMP/baseline"
          git fetch --no-tags --quiet origin codex/forms-rollback-e3b6b5d
          mkdir -p "$RUNNER_TEMP/rollback"
          git -C .. archive "$REHEARSAL_ROLLBACK_BUILD" | tar -x -C "$RUNNER_TEMP/rollback"
          npm run release-rehearsal -- --prev "$RUNNER_TEMP/baseline" --rollback-build "$RUNNER_TEMP/rollback"
      - name: Remove disposable database
        if: always()
        run: docker rm --force schedora-test-pg || true

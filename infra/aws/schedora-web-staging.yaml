AWSTemplateFormatVersion: '2010-09-09'
Description: Staging-only Schedora ECS service using a pre-registered staging task definition. Supabase remains external.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
  CertificateArn:
    Type: String
  AppSecretArn:
    Type: String
    NoEcho: true
  TaskDefinitionArn:
    Type: String
    Description: Existing staging task definition; the failed initial stack retained it.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 1

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS entry point for Schedora staging
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: schedora-web-staging-alb

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Schedora staging tasks accept traffic only from the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 10000
          ToPort: 10000
          SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: schedora-web-staging-task

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: 'false'
      Tags:
        - Key: Name
          Value: schedora-web-staging

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: schedora-web
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 10000
      HealthCheckEnabled: true
      HealthCheckPath: /api/health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: '200'
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      Tags:
        - Key: Name
          Value: schedora-web-staging

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  SchedoraCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: schedora
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: schedora

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: schedora-web-execution
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/SchedoraRuntimeBoundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadSchedoraRuntimeSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecretArn
      Tags:
        - Key: Name
          Value: schedora-web-execution

  SchedoraService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsListener
      - HttpListener
    Properties:
      ServiceName: schedora-web
      Cluster: !Ref SchedoraCluster
      TaskDefinition: !Ref TaskDefinitionArn
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: schedora
          ContainerPort: 10000
          TargetGroupArn: !Ref AppTargetGroup
      HealthCheckGracePeriodSeconds: 90
      EnableExecuteCommand: false

Outputs:
  LoadBalancerDnsName:
    Description: CNAME target for the staging app hostname.
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  EcsClusterName:
    Value: !Ref SchedoraCluster
  EcsServiceName:
    Value: !GetAtt SchedoraService.Name
  TaskDefinitionArn:
    Value: !Ref TaskDefinitionArn

AWSTemplateFormatVersion: '2010-09-09'
Description: Schedora LiveKit staging VM. Creates one public EC2 VM, an Elastic IP, and a restricted media security group; it does not deploy the Schedora app or alter Supabase.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC with an internet gateway and a public subnet route.
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in the selected VPC, with a route to an internet gateway.
  InstanceType:
    Type: String
    Default: c7i.large
    AllowedPattern: '^[a-z][0-9][a-z0-9]*\.[a-z0-9]+$'
    Description: Staging-only starting size. Benchmark before production sizing.
  LiveKitCloudInitBase64:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Base64 of the cloud-init file generated by the official LiveKit generator for staging-only hostnames and credentials. Never use production keys here.

Resources:
  LiveKitSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: LiveKit staging signaling, TURN, and WebRTC media ports
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: TLS signaling and TURN/TLS
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTP for ACME certificate issuance and redirect
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: LiveKit WebRTC over TCP
          IpProtocol: tcp
          FromPort: 7881
          ToPort: 7881
          CidrIp: 0.0.0.0/0
        - Description: TURN over UDP
          IpProtocol: udp
          FromPort: 3478
          ToPort: 3478
          CidrIp: 0.0.0.0/0
        - Description: LiveKit WebRTC media over UDP
          IpProtocol: udp
          FromPort: 50000
          ToPort: 60000
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: Outbound access for updates, TLS issuance, and provider APIs
          IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: schedora-livekit-staging

  LiveKitInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: schedora-livekit-staging
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/SchedoraRuntimeBoundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: schedora-livekit-staging

  LiveKitInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: schedora-livekit-staging
      Roles:
        - !Ref LiveKitInstanceRole

  LiveKitInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}'
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref LiveKitInstanceProfile
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds:
        - !Ref LiveKitSecurityGroup
      UserData: !Ref LiveKitCloudInitBase64
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: schedora-livekit-staging
        - Key: Environment
          Value: staging

  LiveKitElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: schedora-livekit-staging

  LiveKitElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt LiveKitElasticIp.AllocationId
      InstanceId: !Ref LiveKitInstance

Outputs:
  LiveKitElasticIpAddress:
    Description: Point both LiveKit and TURN staging DNS A records at this address.
    Value: !Ref LiveKitElasticIp
  LiveKitInstanceId:
    Description: Use Systems Manager Session Manager for administrative access; no SSH ingress is opened.
    Value: !Ref LiveKitInstance
  LiveKitSecurityGroupId:
    Value: !Ref LiveKitSecurityGroup

# Render Blueprint for the Schedora web app and API in one Docker service.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: schedora-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Keep the deployment in evaluation mode until the production checklist is complete.
    # Select a paid always-on instance in Render before accepting customer data.
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - Dockerfile
        - .dockerignore
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: RELEASE_MODE
        value: evaluation
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: DATABASE_PATH
        value: ./data/schedora.db
      - key: SERVE_FRONTEND
        value: "true"
      - key: FRONTEND_DIR
        value: /app/frontend
      - key: TRUST_PROXY
        value: "true"
      # Browser → Render proxy → app: the client address is one hop from the right.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: BASE_URL
        value: https://schedora.in
      - key: PRODUCT_DOMAIN
        value: schedora.in
      # Add COOKIE_DOMAIN=.schedora.in only after all product domains point at Render.
      # Extra origins allowed to make changes; keep this restricted to owned production domains.
      - key: ALLOWED_ORIGINS
        sync: false
      # open = evaluation: all products available, nothing charged. Switch to enforced only
      # once a payment provider is connected.
      - key: BILLING_MODE
        value: open
      - key: BILLING_PROVIDER
        value: none
      - key: BILLING_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: outbox
      - key: EMAIL_HTTP_URL
        sync: false
      - key: EMAIL_HTTP_TOKEN
        sync: false
      - key: EMAIL_FROM
        value: Schedora <no-reply@schedora.in>
      - key: OPERATOR_NAME
        sync: false
      - key: OPERATOR_CONTACT
        sync: false
      - key: OPERATOR_JURISDICTION
        sync: false
      - key: LOG_LEVEL
        value: info
      # Encrypts stored integration secrets (OAuth tokens, Stripe keys, SSO). Render generates
      # a random 256-bit value; keep it stable, or connected integrations must be reconnected.
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      # Evaluation: paid event types use a simulated checkout until a workspace connects Stripe.
      - key: ALLOW_TEST_PAYMENTS
        value: "true"
      - key: SMS_PROVIDER
        value: outbox
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # OAuth apps for calendars and video (redirect URI: <BASE_URL>/api/oauth/<provider>/callback)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      # AI features (recaps, chat, briefs, Meet Assist drafts)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Meet Assist inbound email webhook secret and address
      - key: INBOUND_EMAIL_SECRET
        generateValue: true
      - key: ASSIST_ADDRESS
        value: assist@schedora.in
      # Schedora Meet native video (LiveKit). OFF until the production gates in docs/MEET_VIDEO.md
      # are met; scheduling works without it. The webhook URL is <API>/api/meet-video/webhooks/<deployment>.
      - key: MEET_VIDEO_PROVIDER
        value: none
      - key: MEET_VIDEO_ENABLED
        value: "false"
      - key: MEET_VIDEO_KILL_SWITCH
        value: "off"
      - key: MEET_VIDEO_DEPLOYMENT
        value: livekit-cloud
      - key: LIVEKIT_HOSTING
        value: cloud
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: MEET_VIDEO_WEBHOOK_CONFIRMED
        sync: false
      - key: MEET_VIDEO_SMOKE_CONFIRMED
        sync: false
      # Owner-approved plan allowances are 100 Meet / 100 Suite credits; keep override unset to use code defaults until video launch gates pass.
      - key: MEET_VIDEO_ALLOWANCES
        sync: false
      - key: MEET_VIDEO_PACKS
        sync: false
      - key: MEET_VIDEO_CATALOG_VERSION
        sync: false
      - key: MEET_VIDEO_RECHARGE_ENABLED
        value: "false"
      - key: MEET_VIDEO_COST_PER_PARTICIPANT_MINUTE_MICROS
        sync: false
      - key: MEET_VIDEO_MONTHLY_COST_BUDGET_MICROS
        sync: false
